<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso | Transformación Cárnica</title>

    <link
        rel="stylesheet"
        href="/static/css/styles.css?v=20260619-3"
    >
</head>

<body class="login-body">
    <main id="loginPage" class="login-container">
        <section class="login-card" aria-labelledby="loginTitle">
            <h1>CAYAL</h1>
            <h2 id="loginTitle">Módulo de Transformación Cárnica</h2>

            <p>Ingresa tus credenciales para continuar</p>

            <form
                id="loginForm"
                onsubmit="event.preventDefault(); iniciarSesion();"
            >
                <label for="usuario">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Usuario"
                    autocomplete="username"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

                <p
                    id="loginError"
                    class="error"
                    aria-live="polite"
                ></p>
            </form>
        </section>
    </main>

    <script src="/static/js/app.js?v=20260619-2"></script>
</body>
</html>
