<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAYAL | Modulo Carnico</title>
    <link rel="icon" type="image/png" href="../static/images/logo-cayal-transparente.png">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body class="login-body">
    <main id="loginPage" class="login-container">
        <section class="login-card" aria-labelledby="loginTitle">
            <img class="login-logo" src="../static/images/logo-cayal-transparente.png" alt="Carnes CAYAL">
            <h2 id="loginTitle">Modulo Carnico</h2>
            <p>Ingresa tus credenciales para continuar</p>

            <form id="loginForm">
                <label for="usuario">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Usuario"
                    autocomplete="username"
                    required
                >

                <label for="password">Contrasena</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Contrasena"
                    autocomplete="current-password"
                    required
                >

                <button id="loginButton" type="submit">
                    Iniciar Sesion
                </button>

                <p
                    id="loginError"
                    class="error"
                    aria-live="polite"
                ></p>
            </form>
        </section>
    </main>

    <div
        id="modal-acceso-denegado"
        class="modal-overlay hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titulo-acceso-denegado"
    >
        <section class="movement-dialog access-denied-dialog">
            <span class="dialog-icon access-denied-icon" aria-hidden="true">!</span>
            <p class="eyebrow">Acceso restringido</p>
            <h2 id="titulo-acceso-denegado">No cuentas con permisos para ingresar</h2>
            <p>Solicita autorización al administrador del sistema.</p>
            <div class="dialog-actions">
                <button id="cerrar-acceso-denegado" type="button">Entendido</button>
            </div>
        </section>
    </div>

    <script src="../static/js/app.js"></script>
</body>
</html>
