<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Relación de documentos</title>
    <link rel="icon" type="image/png" href="../static/images/logo-cayal-transparente.png">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body class="login-body">
    <main id="loginPage" class="login-container">
        <section class="login-card" aria-labelledby="loginTitle">
            <img class="login-logo" src="../static/images/logo-cayal-transparente.png" alt="Carnes CAYAL">
            <h2 id="loginTitle">Modulo Carnico</h2>
            <p>Ingresa tus credenciales para continuar</p>

            <form id="loginForm">
                <label for="usuario">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Usuario"
                    autocomplete="username"
                    required
                >

                <label for="password">Contrasena</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Contrasena"
                    autocomplete="current-password"
                    required
                >

                <button id="loginButton" type="submit">
                    Entrar
                </button>

                <p
                    id="loginError"
                    class="error"
                    aria-live="polite"
                ></p>
            </form>
        </section>
    </main>

    <script src="../static/js/app.js"></script>
</body>
</html>
