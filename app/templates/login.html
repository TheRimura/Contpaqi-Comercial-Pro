<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso | Transformación Cárnica</title>

    <link
        rel="stylesheet"
        href="/static/css/styles.css?v=20260619-2"
    >
</head>

<body class="login-body">
    <main id="loginPage" class="login-container">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-brand-panel">
                <span class="login-brand-mark">C</span>
                <p class="login-kicker">Sistema interno</p>
                <h1>CAYAL</h1>
                <h2>Transformación Cárnica</h2>
                <p>
                    Control operativo de productos, transformaciones,
                    rendimientos y movimientos de inventario.
                </p>
            </div>

            <div class="login-form-panel">
                <p class="form-eyebrow">Acceso seguro</p>
                <h2 id="loginTitle">Iniciar sesión</h2>
                <p class="login-help">
                    Ingresa tus credenciales para acceder al módulo.
                </p>

                <form
                    id="loginForm"
                    onsubmit="event.preventDefault(); iniciarSesion();"
                >
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                    <button type="submit">
                        Iniciar sesión
                    </button>

                    <p
                        id="loginError"
                        class="error"
                        aria-live="polite"
                    ></p>
                </form>
            </div>
        </section>
    </main>

    <script src="/static/js/app.js?v=20260619-2"></script>
</body>
</html>
